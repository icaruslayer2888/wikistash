name: WikiStash Daily Ingest & Free CDN Deploy

on:
  schedule:
    # Runs daily at 00:00 UTC (Zero-Cost Ingestion)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of articles to ingest (1-50)'
        required: false
        default: '50'
      dry_run:
        description: 'Run in dry-run mode (no AI / DB writes)'
        type: boolean
        required: false
        default: false

concurrency:
  group: wikistash-ingest
  cancel-in-progress: false

jobs:
  ingest-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🛠️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🗄️ Ensure Cloudflare D1 Schema Exists
        if: inputs.dry_run != true
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            SQL_FILE=$(ls migrations/*.sql supabase/*.sql 2>/dev/null | head -n 1)
            if [ -n "$SQL_FILE" ]; then
              echo "Applying $SQL_FILE to wikistash-db..."
              npx wrangler d1 execute wikistash-db --remote --file="$SQL_FILE"
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🧠 Run Wikipedia Ingestion & Gemini Summarization
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          pnpm run ingest -- --limit=${{ inputs.limit || 50 }} $EXTRA_FLAGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: 🏗️ Build Static Next.js Application (out/)
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🚀 Deploy Static Site to Cloudflare Pages ($0/mo Unlimited Traffic)
        run: |
          npx wrangler pages project create wikistash --production-branch=main || true
          npx wrangler pages deploy out --project-name=wikistash --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 💾 Commit Updated Feed Data to Git (Optional Backup)
        if: success() && inputs.dry_run != true
        run: |
          git config --global user.name "WikiStash Bot"
          git config --global user.email "bot@wikistash.app"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update daily feed [$(date -u +'%Y-%m-%d')] [skip ci]"
            git push origin main || echo "Git push skipped or non-fatal."
          fi
